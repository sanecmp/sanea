[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sanea"
version = "0.1.0"
description = "Parent application for child computer digital wellbeing"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cheroot>=11.1,<12",
    "cryptography>=46,<48",
    "django-siteforms>=1.3,<2",
    "django-etc>=1.4,<2",
    "django-sitegate>=1.3.3,<2",
    "django-siteajax>=1,<2",
    "django-sitetree>=1.18.1,<2",
    "Django>=6.1,<6.2",
    "envbox>=2.0.1,<3",
    "pydantic>=2.13,<3",
    "sanelib>=0.1,<0.2",
]

[tool.uv.sources]
sanelib = { path = "../sanelib", editable = true }

[project.scripts]
sanea = "sanea.cli:main"

[dependency-groups]
tests = [
    "pytest>=8,<10",
    "pytest-datafixtures>=1.1,<2",
    "pytest-djangoapp>=1.8,<2",
    "time-machine>=3,<4",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.makeapp.tests]
workflow_github = ".github/workflows/sanea.yml"

[tool.hatch.build.targets.sdist]
include = ["/src/sanea", "/pyproject.toml", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/sanea"]
