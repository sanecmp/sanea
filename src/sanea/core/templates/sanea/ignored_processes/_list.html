{% load i18n %}
<div id="ignored-processes-list"{% if list_oob %} hx-swap-oob="outerHTML"{% endif %}>
    <section class="card">
        <div class="table-responsive sanea-table-wrap">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">{% translate "Process name" %}</th>
                    <th scope="col">{% translate "Updated" %}</th>
                    <th scope="col"><span class="visually-hidden">{% translate "Actions" %}</span></th>
                </tr>
                </thead>
                <tbody>
                {% for exclusion in ignored_processes %}
                    <tr>
                        <td><code>{{ exclusion.prc_name }}</code></td>
                        <td class="small text-body-secondary text-nowrap">{{ exclusion.updated|date:"Y-m-d H:i" }}</td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary sanea-icon-button" id="ignored-process-edit-{{ exclusion.pk }}"
                               href="{% url 'core:limits' %}?exclusion={{ exclusion.pk }}#ignored-processes"
                               hx-get="{% url 'core:limits' %}?exclusion={{ exclusion.pk }}"
                               hx-target="#ignored-process-editor" hx-swap="innerHTML"
                               title="{% translate 'Edit' %}" aria-label="{% translate 'Edit' %}">
                                <svg class="sanea-action-icon" aria-hidden="true"><use href="#icon-edit"></use></svg>
                            </a>
                            <form class="d-inline" method="post" action="{% url 'core:limits' %}#ignored-processes"
                                  hx-post="{% url 'core:limits' %}"
                                  hx-target="#ignored-process-editor" hx-swap="innerHTML">
                                {% csrf_token %}
                                <input type="hidden" name="exclusion" value="{{ exclusion.pk }}">
                                <button class="btn btn-sm btn-outline-danger sanea-icon-button"
                                        id="ignored-process-delete-{{ exclusion.pk }}" type="submit" name="delete" value="1"
                                        title="{% translate 'Remove' %}" aria-label="{% translate 'Remove' %}">
                                    <svg class="sanea-action-icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                                </button>
                            </form>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td class="text-body-secondary text-center py-5" colspan="3">
                            {% translate "No process names are ignored." %}
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>
