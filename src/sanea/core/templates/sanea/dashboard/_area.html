{% load i18n %}
<div id="dashboard-area">
    <section class="card mb-4">
        <div class="card-body p-3 p-lg-4">
            <form id="dashboard-filter" class="sanea-dashboard-filter" method="get" action="{{ dashboard_url }}"
                  hx-get="{{ dashboard_url }}" hx-target="#dashboard-area" hx-swap="outerHTML"
                  hx-push-url="true" hx-trigger="change delay:150ms">
                {{ dashboard_filter }}
                <button class="btn btn-primary align-self-end" type="submit">{% translate "Apply" %}</button>
            </form>
        </div>
    </section>

    {% include "sanea/dashboard/_usage.html" %}
</div>
