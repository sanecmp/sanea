{% with connection=item.get_connection_status %}
<span id="computer-connection-{{ item.pk }}" class="sanea-status-icon" role="img"
      title="{{ connection.label }}" aria-label="{{ connection.label }}">
    <svg class="sanea-action-icon" aria-hidden="true">
        <use href="{% if connection == 'online' %}#icon-online{% elif connection == 'overdue' %}#icon-clock{% else %}#icon-offline{% endif %}"></use>
    </svg>
</span>
{% endwith %}
