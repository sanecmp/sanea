{% load i18n %}
<div id="computer-list" tabindex="-1">
    <section class="card mb-3">
        <div class="card-body p-3 p-lg-4">
            <form id="computer-filter" class="sanea-computer-filter" method="get" action="{{ computers_url }}"
                  hx-get="{{ computers_url }}" hx-target="#computer-list" hx-swap="outerHTML"
                  hx-push-url="true" hx-trigger="change delay:150ms" hx-include="#issue-filter">
                {{ computer_filter }}
                <button class="btn btn-primary align-self-end" type="submit">{% translate "Apply" %}</button>
            </form>
        </div>
    </section>
    {% include "sanea/computers/_table.html" %}
</div>
