{% load i18n %}
<span class="text-nowrap" id="computer-command-counts-{{ item.pk }}">
    <a class="link-secondary" id="computer-command-pending-{{ item.pk }}"
       href="{% url 'core:computer_commands' %}?command_computer={{ item.pk }}&amp;command_status=pending"
       title="{% translate 'Pending' %}"
       aria-label="{% blocktranslate with computer_name=item.get_display_name %}View pending commands for {{ computer_name }}{% endblocktranslate %}">{{ item.pending_command_count }}</a>
    <span aria-hidden="true"> / </span>
    <a class="{% if item.failed_command_count %}text-danger{% else %}link-secondary{% endif %}"
       id="computer-command-failed-{{ item.pk }}"
       href="{% url 'core:computer_commands' %}?command_computer={{ item.pk }}&amp;command_status=failed"
       title="{% translate 'Failed' %}"
       aria-label="{% blocktranslate with computer_name=item.get_display_name %}View failed commands for {{ computer_name }}{% endblocktranslate %}">{{ item.failed_command_count }}</a>
</span>
