{% load i18n %}
<section class="card mb-4" id="command-history">
    <div class="card-body p-4">
        {% if message %}
            <div class="mb-3">{% include "sanea/_message.html" %}</div>
        {% endif %}
        <form id="command-filter" class="sanea-command-filter" method="get" action="{{ commands_url }}"
              hx-get="{{ commands_url }}" hx-target="#command-history" hx-swap="outerHTML"
              hx-push-url="true" hx-trigger="change delay:150ms">
            {{ command_filter }}
            <button class="btn btn-primary align-self-end" type="submit">{% translate "Apply" %}</button>
        </form>
    </div>
    {% include "sanea/computers/_command_table.html" %}
</section>
