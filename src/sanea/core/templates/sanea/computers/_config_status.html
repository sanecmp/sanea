{% load i18n %}
{% with delivery=item.get_config_delivery_status %}
<span id="computer-config-status-{{ item.pk }}" class="sanea-status-icon" role="img"
      title="{% translate 'Settings' %}: {{ delivery.label }}" aria-label="{% translate 'Settings' %}: {{ delivery.label }}">
    <svg class="sanea-action-icon" aria-hidden="true">
        <use href="{% if delivery == 'applied' %}#icon-check{% else %}#icon-clock{% endif %}"></use>
    </svg>
</span>
{% endwith %}
