{% load i18n %}
<div class="modal-header px-4">
    <h2 class="modal-title h5 fw-bold" id="computer-dialog-title">{{ computer.get_display_name }}</h2>
    <a class="btn-close" href="{{ computers_url }}" data-dialog-close aria-label="{% translate 'Close' %}"></a>
</div>
<form id="computer-save" data-dialog-panel method="post" action="{{ computers_url }}"
      hx-post="{{ computers_url }}" hx-target="#computer-editor" hx-swap="innerHTML"
      hx-include="#computer-filter select" hx-disabled-elt="find button[type='submit']">
    {% csrf_token %}
    <input type="hidden" name="computer" value="{{ computer.pk }}">
    <div class="modal-body p-4">
        {{ computer_form }}
    </div>
    <div class="modal-footer px-4">
        <a class="btn btn-outline-secondary" id="computer-cancel-{{ computer.pk }}" href="{{ computers_url }}" data-dialog-close>
            {% translate "Cancel" %}
        </a>
        <button class="btn btn-primary" type="submit" name="__submit" value="computer">{% translate "Save" %}</button>
    </div>
</form>
