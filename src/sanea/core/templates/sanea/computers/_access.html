{% load i18n %}
{% if item.status == 'allowed' %}{% translate 'Synchronization allowed' as access %}{% elif item.status == 'blocked' %}{% translate 'Synchronization blocked' as access %}{% else %}{% translate 'Pending' as access %}{% endif %}
<span id="computer-access-{{ item.pk }}" class="sanea-status-icon" role="img"
      title="{% translate 'Synchronization' %}: {{ access }}"
      aria-label="{% translate 'Synchronization' %}: {{ access }}">
    <svg class="sanea-action-icon" aria-hidden="true">
        <use href="{% if item.status == 'allowed' %}#icon-check{% elif item.status == 'blocked' %}#icon-ban{% else %}#icon-clock{% endif %}"></use>
    </svg>
</span>
