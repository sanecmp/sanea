{% load i18n %}
<span id="computer-access-{{ item.pk }}"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
    <span class="badge {% if item.status == 'allowed' %}text-bg-success{% elif item.status == 'blocked' %}text-bg-danger{% else %}text-bg-warning{% endif %}">
        {% if item.status == 'allowed' %}
            {% translate "Synchronization allowed" %}
        {% elif item.status == 'blocked' %}
            {% translate "Synchronization blocked" %}
        {% else %}
            {{ item.get_status_display }}
        {% endif %}
    </span>
</span>
