{% load i18n %}
<fieldset class="sanea-limits-row" data-form-row data-form-prefix="{{ form.prefix }}"{% if not form.is_bound and not form.instance.pk %} data-extra-row{% endif %}>
    <legend>{{ row_heading }}</legend>
    {{ form }}
    {% if kind == 'apps' %}
        {% for datalist_id, values in form.suggestions.items %}
            <datalist id="{{ datalist_id }}">
                {% for suggestion in values %}<option value="{{ suggestion.value }}"{% if suggestion.name %} label="{{ suggestion.name }}"{% endif %}>{{ suggestion.name }}</option>{% endfor %}
            </datalist>
        {% endfor %}
    {% endif %}
    <div class="sanea-limits-actions mt-3">
        {% if form.instance.pk %}
            <button class="btn btn-outline-danger d-inline-flex align-items-center gap-2" type="submit" form="account-remove-{{ kind }}-{{ form.instance.pk }}">
                <svg class="sanea-action-icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                {% translate "Remove" %}
            </button>
        {% else %}
            <button class="btn btn-outline-danger d-inline-flex align-items-center gap-2" type="button" data-discard-form hidden>
                <svg class="sanea-action-icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                {% translate "Remove" %}
            </button>
        {% endif %}
    </div>
</fieldset>
