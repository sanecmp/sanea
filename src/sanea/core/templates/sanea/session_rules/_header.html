{% load i18n %}
<div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
        <h1 class="display-6 fw-bold mb-1">{% translate "Session rules" %}</h1>
        <p class="text-body-secondary mb-0">
            {% blocktranslate with limits=limits %}Limits set: {{ limits }}{% endblocktranslate %}
        </p>
    </div>
    <a class="btn btn-primary" id="session-rule-add" href="{{ session_rules_url }}?rule=new"
       hx-get="{{ session_rules_url }}?rule=new" hx-target="#session-rule-editor" hx-swap="innerHTML">
        <svg class="sanea-action-icon me-1" aria-hidden="true"><use href="#icon-plus"></use></svg>
        {% translate "Add session rule" %}
    </a>
</div>
{% include "sanea/limits/_scope.html" with scope=limits.get_editing_scope scope_name_shown=True %}
